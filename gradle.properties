org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true
# Temporary opt-outs for AGP 9. The project still applies org.jetbrains.kotlin.android and the
# variant DSL that AGP 9 deprecates. Both flags are removed in AGP 10; the forward path is AGP's
# built-in Kotlin with the new DSL (see docs/architecture.md, section 6).
android.builtInKotlin=false
android.newDsl=false
