// CI-only transport override for one pinned module. Keep its published POM and transitive graph intact.
import groovy.json.JsonSlurper
import java.security.MessageDigest

settingsEvaluated { settings ->
    def pin = new JsonSlurper().parse(new File(settings.settingsDir, 'scripts/ci-download-pins.json')).kotlinCompiler
    def repository = new File(settings.settingsDir, '.tools/ci-maven')
    def module = new File(repository, "${pin.group.replace('.', '/')}/${pin.artifact}/${pin.version}")
    def verify = { File file, String expected ->
        def digest = MessageDigest.getInstance('SHA-256')
        file.withInputStream { input ->
            byte[] buffer = new byte[65536]
            int count
            while ((count = input.read(buffer)) != -1) digest.update(buffer, 0, count)
        }
        if (digest.digest().encodeHex().toString() != expected) {
            throw new GradleException("Pinned CI compiler integrity mismatch: ${file.name}")
        }
    }
    verify(new File(module, pin.name), pin.sha256)
    verify(new File(module, pin.name.replaceAll(/\.jar$/, '.pom')), pin.pom.sha256)
    settings.dependencyResolutionManagement.repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'CassiniPinnedCICompiler'
                    url = repository.toURI()
                    metadataSources { mavenPom() }
                }
            }
            filter { includeVersion(pin.group, pin.artifact, pin.version) }
        }
    }
}
