name: Native runtime

# Builds the sherpa-onnx AAR from the pinned source and compares it with the pinned release build
# (docs/native-runtime.md). It takes about 17 minutes, so it runs weekly, by hand, and when a change can affect
# the native build: the scripts of the native build (setup.sh and every script, pin and patch it uses), the C++
# sources and CMake setup of libcassini_opus, or gradle/libs.versions.toml (the NDK and sherpa-onnx versions).
# scripts/check-native-paths.py (android.yml checks) fails when the scripts listed below are not those setup.sh uses.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/setup.sh'
      - 'scripts/package-whistle.py'
      - 'scripts/whistle_payload.py'
      - 'scripts/build-whistle-runtime.py'
      - 'whistle/worker-pins.json'
      - 'whistle/pins.json'
      - 'whistle/abi-check.cpp'
      - 'whistle/exports.map'
      - 'scripts/native-common.sh'
      - 'scripts/native-dependencies.json'
      - 'scripts/streaming-diarization.patch'
      - 'scripts/build-native-aar.sh'
      - 'scripts/ci-downloads.py'
      - 'scripts/ci-download-pins.json'
      - 'scripts/fetch-native-aar.sh'
      - 'scripts/fetch-opus-source.sh'
      - 'scripts/verify-native-runtime.sh'
      - 'scripts/heavy-lock.sh'
      - 'engine/src/main/cpp/**'
      - 'engine/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/actions/pinned-ndk/**'
      - '.github/workflows/native.yml'
  pull_request:
    paths:
      - 'scripts/setup.sh'
      - 'scripts/package-whistle.py'
      - 'scripts/whistle_payload.py'
      - 'scripts/build-whistle-runtime.py'
      - 'whistle/worker-pins.json'
      - 'whistle/pins.json'
      - 'whistle/abi-check.cpp'
      - 'whistle/exports.map'
      - 'scripts/native-common.sh'
      - 'scripts/native-dependencies.json'
      - 'scripts/streaming-diarization.patch'
      - 'scripts/build-native-aar.sh'
      - 'scripts/ci-downloads.py'
      - 'scripts/ci-download-pins.json'
      - 'scripts/fetch-native-aar.sh'
      - 'scripts/fetch-opus-source.sh'
      - 'scripts/verify-native-runtime.sh'
      - 'scripts/heavy-lock.sh'
      - 'engine/src/main/cpp/**'
      - 'engine/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/actions/pinned-ndk/**'
      - '.github/workflows/native.yml'

permissions:
  contents: read

concurrency:
  # As in android.yml: only a pull request's newer push cancels its older run; each push to main has its own group.
  group: native-${{ github.event_name }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    name: sherpa-onnx AAR from source
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && !startsWith(github.ref, 'refs/tags/') && vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-24.04' }}
    # About 2.3x the longest job seen (19.4 min in 65 runs; D66 AND-8).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Restore and verify pinned Android NDK
        uses: ./.github/actions/pinned-ndk
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      # Every ref restores the archives; only main saves them, after the build below has fetched them (D66 AND-6).
      - name: Restore and verify pinned Gradle distribution
        uses: ./.github/actions/pinned-gradle
      - name: Restore and verify native-source Gradle distribution
        uses: ./.github/actions/pinned-gradle
        with:
          kind: native
      - name: Restore the pinned source archives
        id: source-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/native-build/sherpa-onnx.tar.gz
            .tools/opus/source.tar.gz
          key: native-source-${{ hashFiles('scripts/native-dependencies.json') }}
      # The app's Robolectric tests below need android-all; without this cache every run downloaded it from Maven
      # Central and failed when that download did (D66 AND-3). Restore only: android.yml saves the entry on main,
      # one per Robolectric version.
      - name: Find the Robolectric version
        id: robolectric
        run: |
          version=$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore Robolectric's Android runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ steps.robolectric.outputs.version }}-
          restore-keys: robolectric-${{ steps.robolectric.outputs.version }}-
      # setup.sh finds the pinned NDK inside ANDROID_HOME. The job reports drift and does not fail
      # on it: a source build is not yet known to match the release byte for byte. The summary
      # records both hashes and a mismatch raises a warning annotation.
      - name: Prefetch checksum-pinned native runtime without forwarding credentials to the build
        env:
          CASSINI_GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-downloads.py native --output .tools/native-build/onnxruntime
      - name: Build the AAR from source
        run: ./scripts/setup.sh --from-source
      - name: Save the pinned source archives
        if: github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' && steps.source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/native-build/sherpa-onnx.tar.gz
            .tools/opus/source.tar.gz
          key: native-source-${{ hashFiles('scripts/native-dependencies.json') }}
      - name: Record the AAR hashes
        id: hashes
        run: |
          . scripts/native-common.sh
          built=$(sha256_of "$aar_installed")
          pinned=$(pin sherpa-onnx-aar sha256)
          {
            echo "Source-built AAR: \`$built\`"
            echo
            echo "Pinned release AAR: \`$pinned\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$built" != "$pinned" ]; then
            echo "::warning title=Native AAR drift::The AAR built from source ($built) differs from the pinned release build ($pinned)."
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi
      # The release asset of the codemyriad/sherpa-onnx fork (coordination D53.2, D53.3) is this Linux build: the AAR,
      # the ONNX Runtime archive it was linked against, and their SHA-256 sums, kept for 90 days. Only builds of main
      # (pushes, the weekly run, manual runs) feed the release, so pull requests neither fetch nor keep it (D66).
      - name: Collect the AAR for the release
        if: github.event_name != 'pull_request'
        run: |
          . scripts/native-common.sh
          out=$RUNNER_TEMP/sherpa-onnx-android
          mkdir -p "$out"
          cp "$aar_installed" "$out/"
          cp scripts/streaming-diarization.patch "$out/"
          # Reuse the exact verified archive already fetched for both ABIs.
          cp .tools/native-build/onnxruntime-android-1.27.1.zip "$out/"
          (cd "$out" && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Upload the AAR for the release
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sherpa-onnx-android-aar
          path: ${{ runner.temp }}/sherpa-onnx-android
          retention-days: 90
      # android.yml runs these tests on the same commit with the pinned AAR. On a pull request whose source build gives
      # the pinned bytes, the inputs are identical, so the run here would repeat it (D66); with drift it runs, and it
      # always runs on main, weekly and by hand.
      - name: Build and test the app with the source-built AAR
        if: steps.hashes.outputs.drift == 'true' || github.event_name != 'pull_request'
        run: ./gradlew --no-daemon -Pandroid.builder.sdkDownload=false :app:assembleDebug :core:test :engine:testDebugUnitTest :app:testDebugUnitTest
      # The XML results keep the standard error of each test class: a coroutine that fails after its test ended
      # writes its stack trace there.
      - name: Upload the test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-aar-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            core/build/test-results/test/
            engine/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
