name: Whistle native input

on:
  push:
    branches: [main]
    paths:
      - 'whistle/**'
      - 'scripts/build-whistle-runtime.py'
      - 'scripts/check-whistle-device.py'
      - '.github/workflows/whistle.yml'
  pull_request:
    paths:
      - 'whistle/**'
      - 'scripts/build-whistle-runtime.py'
      - 'scripts/check-whistle-device.py'
      - '.github/workflows/whistle.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whistle-${{ github.event_name }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native-input:
    name: Pinned arm64 API 26 link and input integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'ndk;28.2.13676358 platforms;android-34 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Reject corrupt and missing offline inputs
        run: python3 -m unittest discover -s whistle -p 'test_*.py' -v
      - name: Fetch verified published inputs and link against API 26
        run: python3 scripts/build-whistle-runtime.py --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - name: Rebuild offline and refuse an unavailable ABI
        run: |
          before=$(sha256sum .tools/whistle/libcassini_needle.so)
          python3 scripts/build-whistle-runtime.py --ndk "$ANDROID_HOME/ndk/28.2.13676358" --offline
          test "$before" = "$(sha256sum .tools/whistle/libcassini_needle.so)"
          if python3 scripts/build-whistle-runtime.py --abi x86_64 --offline > .tools/whistle/x86_64.txt 2>&1; then
            echo 'Unexpected x86_64 Whistle runtime' >&2
            exit 1
          fi
          grep -F 'Whistle unavailable for x86_64' .tools/whistle/x86_64.txt
      - name: Check lab helper entry points
        run: |
          python3 whistle/spike/prepare.py --help > /dev/null
          python3 whistle/spike/run.py --help > /dev/null
      - name: Compile the standalone lab JNI and Java
        run: >-
          python3 whistle/spike/build.py --compile-only
          --sdk "$ANDROID_HOME" --java-home "$JAVA_HOME"
          --output .tools/whistle-spike
      - name: Record compatibility evidence
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          r = json.loads(Path('.tools/whistle/report.json').read_text())
          print(f'arm64: {r["size"]:,} bytes, SHA-256 `{r["sha256"]}`')
          print(f'API 26 strict link; PT_LOAD alignments: {r["loadAlignments"]}; dependencies: {r["needed"]}')
          print('x86_64 unavailable. This job does not run Android, load a model, or prove inference/DC parity.')
          PY
      - name: Upload the native inspection report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whistle-native-report
          path: .tools/whistle/report.json
          if-no-files-found: error
