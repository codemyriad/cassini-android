name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: '30 2 * * *' # Nightly UTC; all four APIs, even when main has not changed.
  workflow_dispatch:
  workflow_call:
    inputs:
      daily_test:
        type: boolean
        default: false
      daily_plan:
        type: string
        default: '{}'
    secrets:
      CASSINI_RELEASE_KEYSTORE:
        required: false
      CASSINI_RELEASE_STORE_PASSWORD:
        required: false
      CASSINI_RELEASE_KEY_PASSWORD:
        required: false
      CASSINI_RELEASE_KEY_ALIAS:
        required: false
      PLAY_SERVICE_ACCOUNT_JSON:
        required: false

permissions:
  contents: read

# The weekly model and native runtime checks are in models.yml and native.yml (docs/development.md).
concurrency:
  # A newer push to a pull request cancels its older push run. Pushes to main and tags never cancel or replace each
  # other (D66 AND-7): each commit has its own group, because GitHub keeps one pending run per group and drops the
  # other even without cancel-in-progress (run 41335351975, main's tip f94c3a3c, was dropped 2 s after it was made).
  # Manual runs use main's ref too; their own group keeps a push from cancelling them. All label events get their own
  # non-cancelling group so synchronize/opened + labeled on the same head never leave CANCELLED checks (UNSTABLE).
  group: android-${{ inputs.daily_test && 'test-release-' || '' }}${{ github.event_name }}-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}${{ github.event.action == 'labeled' && format('-label-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action != 'labeled' }}

env:
  CASSINI_PERF_GATE: ${{ ((!inputs.daily_test && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '1' || '' }}

jobs:
  checks:
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    name: Wrapper, detekt, actionlint, shellcheck, ruff, links, fonts and the verbatim diff
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && !startsWith(github.ref, 'refs/tags/') && vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-verbatim.sh compares with the 0.1.0 code at the phase-0 base commit.
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      - name: Restore and verify pinned Gradle distribution
        uses: ./.github/actions/pinned-gradle
      - name: Download detekt dependencies (network only, bounded)
        env:
          CASSINI_GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/ci-downloads.py detekt
      - name: Prove real wrapper cache use and checksum refusal offline
        run: python3 tests/ci/wrapper-smoke.py
      # Static analysis runs on the root project without configuring :engine or any Android subproject,
      # and unsetting ANDROID_HOME proves detekt never touches or auto-downloads SDK/NDK packages.
      - name: detekt
        run: >-
          env -u ANDROID_HOME -u ANDROID_SDK_ROOT
          ./gradlew --no-daemon --init-script scripts/ci-pinned-compiler.init.gradle
          -PcassiniStaticChecksOnly=true -Pandroid.builder.sdkDownload=false :detekt
      - name: Download checksum-pinned actionlint
        env:
          CASSINI_GITHUB_TOKEN: ${{ github.token }}
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          python3 scripts/ci-downloads.py actionlint
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --quiet
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tools/*.sh
      - name: ruff
        run: pipx run --spec ruff==0.14.0 ruff check --config config/ruff.toml scripts tools
      - name: CI download failure tests
        run: python3 -m unittest discover -s tests/ci -p 'test_*.py' -v
      - name: Relative links in the Markdown files
        run: scripts/check-links.sh
      - name: Bundled fonts match their pins
        run: scripts/fetch-fonts.sh --check
      - name: No resource name is in both :app and :ui
        run: python3 -I scripts/check-resource-collisions.py
      - name: native.yml runs on every change to the native build's scripts
        run: python3 -I scripts/check-native-paths.py
      - name: CM_RUNNER moves jobs only for "hetzner" and never on tags
        run: python3 -I scripts/check-runner-selection.py
      # The release job publishes this section as the release notes. A tag without one fails here, so the release
      # job does not run. The build job does not wait for this job; the emulator jobs do (D66 AND-11).
      - name: CHANGELOG.md has a section for the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 -I scripts/changelog-section.py "$GITHUB_REF_NAME" > /dev/null
      - name: Kept engine code has only its reviewed differences from 0.1.0
        run: scripts/check-verbatim.sh

  # The :core module needs only a JDK: no Android SDK, NDK, sherpa-onnx AAR or Opus source.
  core-only:
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'full-ci') }}
    name: Engine and app logic tests with a JDK alone
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && !startsWith(github.ref, 'refs/tags/') && vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: true
      # No setup.sh. The runner image ships an Android SDK; hiding it proves :core does not need one.
      # --configure-on-demand keeps Gradle from configuring the Android modules (docs/development.md).
      - name: Restore and verify pinned Gradle distribution
        uses: ./.github/actions/pinned-gradle
      - name: Prove CASSINI_PERF_GATE invalidates Test task caching
        run: python3 tests/ci/perf-gate-cache-smoke.py
      - name: Run the :core tests
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew --no-daemon --configure-on-demand :core:test :app-logic:test
      - name: Upload the :core test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-tests
          path: |
            core/build/reports/tests/
            app-logic/build/reports/tests/
          if-no-files-found: ignore

  build:
    if: ${{ (github.event.action != 'labeled' || github.event.label.name == 'full-ci') && (!inputs.daily_test || (inputs.daily_test && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) }}
    # CM_RUNNER=hetzner moves trusted runs (push, schedule, workflow_dispatch, or same-repo PR) to cm-hetzner, never on
    # a tag: tag builds restore the release signing key (below) and only run GitHub-hosted. scripts/check-runner-selection.py checks every runs-on.
    runs-on: ${{ inputs.daily_test != true && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && !startsWith(github.ref, 'refs/tags/') && vars.CM_RUNNER == 'hetzner' && fromJSON('["self-hosted","cm-hetzner"]') || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - name: Restore and verify pinned Android NDK
        uses: ./.github/actions/pinned-ndk
      # The only job that saves the Gradle User Home (on main; pull requests only read it). Every other job of the
      # workflows has cache-read-only (D66 AND-12): they share the exact key, and core-only, which ends first, saved
      # a home without the Android dependencies or task outputs, so build could not save its own and started cold.
      # Signed daily builds restore only, like tags; their Gradle state must not reach the shared unsigned cache.
      # Only GitHub-hosted runs save caches: a tag build restores them while it holds the release signing key, so
      # nothing a self-hosted (cm-hetzner) machine wrote may reach it. Those machines keep their own Gradle home.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
          cache-read-only: ${{ inputs.daily_test || github.ref != 'refs/heads/main' || runner.environment != 'github-hosted' }}
      # The release key signs the GitHub APK and the Play bundle (docs/release.md, "Signing"). No fallbacks: a tag
      # build without the four secrets fails here.
      - name: Restore and verify pinned Gradle distribution
        uses: ./.github/actions/pinned-gradle
      - name: Restore the release signing key
        if: (startsWith(github.ref, 'refs/tags/') || (inputs.daily_test && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')))
        env:
          RELEASE_KEYSTORE: ${{ secrets.CASSINI_RELEASE_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.CASSINI_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CASSINI_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CASSINI_RELEASE_KEY_ALIAS }}
        run: |
          for secret in RELEASE_KEYSTORE STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!secret}" ]; then echo "::error::The secret for $secret is not set"; exit 1; fi
          done
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          {
            echo "CASSINI_RELEASE_KEYSTORE_FILE=$keystore"
            echo "CASSINI_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CASSINI_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "CASSINI_RELEASE_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
      # setup.sh fetches the pinned release AAR and fails fast when it cannot. Only native.yml builds the AAR from
      # source (weekly, by hand, and on changes to the native inputs). The NDK above compiles libcassini_opus.so.
      # Every ref restores the caches; only main saves them (D66 AND-6). Each PR ref used to save its own copy, and the
      # repository went over its 10 GB cache quota, so GitHub evicted the Gradle entries that keep builds warm.
      - name: Restore the native runtime
        id: native-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/m2/org
            .tools/opus/source.tar.gz
          key: native-${{ hashFiles('scripts/native-dependencies.json', 'scripts/streaming-diarization.patch', 'gradle/libs.versions.toml') }}
      - name: Fetch the pinned native runtime
        run: ./scripts/setup.sh --prebuilt-only
      - name: Save the native runtime
        if: github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/m2/org
            .tools/opus/source.tar.gz
          key: native-${{ hashFiles('scripts/native-dependencies.json', 'scripts/streaming-diarization.patch', 'gradle/libs.versions.toml') }}
      # Robolectric downloads one android-all jar for each SDK the tests use (robolectric.properties and @Config).
      # The entry follows the Robolectric version only, not the whole catalog, and main saves a new one only when the
      # tests added a jar. native.yml restores the same entry.
      - name: Find the Robolectric version
        id: robolectric
        run: |
          version=$(sed -n 's/^robolectric = "\(.*\)"$/\1/p' gradle/libs.versions.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore Robolectric's Android runtime
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ steps.robolectric.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: robolectric-${{ steps.robolectric.outputs.version }}-
      - name: List the restored Robolectric jars
        id: robolectric-restored
        run: |
          mkdir -p ~/.m2/repository/org/robolectric
          echo "jars=$(find ~/.m2/repository/org/robolectric -name '*.jar' | sort | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      # On tags the device tests run against releaseTest (the release build without R8), because R8
      # removes members the tests call; the emulator job then launch-checks the published release APK.
      # Keep arbitrary PR titles in an artifact, not a cross-job output that GitHub may discard as a secret.
      - name: Download the reserved test plan and complete notes
        if: inputs.daily_test
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: internal-test-release-plan
          path: .tools/daily-test-release
      - name: Apply the reserved internal-test version in this workspace
        if: inputs.daily_test
        env:
          DAILY_TEST_PLAN: ${{ inputs.daily_plan }}
        run: python3 -I scripts/daily-test-release.py apply
      - name: Snapshot build memory limits before Gradle
        continue-on-error: true
        run: python3 -I scripts/ci-memory-evidence.py before
      - name: Build APK, run unit and conformance tests, and lint
        env:
          BUILD_TYPE: ${{ (startsWith(github.ref, 'refs/tags/') || (inputs.daily_test && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && 'Release' || 'Debug' }}
          DEVICE_TEST_TYPE: ${{ (startsWith(github.ref, 'refs/tags/') || (inputs.daily_test && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && 'releaseTest' || 'debug' }}
          # On tags, also the bundle for Google Play.
          BUILD_BUNDLE: ${{ (startsWith(github.ref, 'refs/tags/') || (inputs.daily_test && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) }}
        # Separate device-APK run: with -PdeviceTestBuildType=releaseTest, AGP 9 makes unit-test tasks only for
        # that build type, so ciTest (testDebugUnitTest) cannot run in the same invocation on a tag.
        # Tags also use a separate bundle-only configuration below (AGP resource-shrinker limitation).
        run: |
          # Debug instrumentation shares this configuration; tags still need the separate releaseTest graph.
          device_tasks=()
          if [ "$DEVICE_TEST_TYPE" = debug ]; then
            device_tasks+=(:app:assembleDebugAndroidTest)
          fi
          ./gradlew --no-daemon --profile -Pandroid.builder.sdkDownload=false \
            ":app:assemble$BUILD_TYPE" :data:assembleDebugAndroidTest \
            ciTest :bench:compileDebugKotlin ":app:lint$BUILD_TYPE" ":data:lint$BUILD_TYPE" ":ui:lint$BUILD_TYPE" \
            "${device_tasks[@]}"
          if [ "$DEVICE_TEST_TYPE" != debug ]; then
            ./gradlew --no-daemon --profile -Pandroid.builder.sdkDownload=false \
              -PdeviceTestBuildType="$DEVICE_TEST_TYPE" \
              ":app:assemble${DEVICE_TEST_TYPE^}" ":app:assemble${DEVICE_TEST_TYPE^}AndroidTest"
          fi
          # AGP's R8 resource shrinker cannot build multi-APK outputs and an AAB in one configuration.
          if [ "$BUILD_BUNDLE" = true ]; then
            ./gradlew --no-daemon -Pandroid.builder.sdkDownload=false -PcassiniBundle=true :app:bundleRelease
          fi
      - name: Snapshot build memory counters after Gradle
        if: always()
        continue-on-error: true
        run: python3 -I scripts/ci-memory-evidence.py after
      - name: List the Robolectric jars after the tests
        id: robolectric-used
        if: github.ref == 'refs/heads/main'
        run: echo "jars=$(find ~/.m2/repository/org/robolectric -name '*.jar' | sort | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - name: Save Robolectric's Android runtime
        if: github.ref == 'refs/heads/main' && runner.environment == 'github-hosted' && steps.robolectric-used.outputs.jars != steps.robolectric-restored.outputs.jars
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ steps.robolectric.outputs.version }}-${{ github.run_id }}-${{ github.run_attempt }}
      # ciTest runs verifyRoborazziDebug in :ui. It writes the actual image and a diff of each changed golden to
      # <module>/build/outputs/roborazzi.
      - name: Upload the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roborazzi-diffs
          path: '**/build/outputs/roborazzi'
          if-no-files-found: ignore
      - name: Prepare installable APK
        env:
          TAG: ${{ inputs.daily_test && format('v{0}', fromJSON(inputs.daily_plan).version_name) || github.ref_name }}
          APK_VARIANT: ${{ (startsWith(github.ref, 'refs/tags/') || (inputs.daily_test && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && 'release' || 'debug' }}
          IS_TAG: ${{ (startsWith(github.ref, 'refs/tags/') || (inputs.daily_test && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) }}
        run: |
          python3 scripts/package-apk.py
      - name: Collect corresponding native sources
        if: (startsWith(github.ref, 'refs/tags/') || (inputs.daily_test && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')))
        run: python3 scripts/package-native-sources.py
      - name: Upload APK and sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cassini-android
          compression-level: 0
          path: dist/*
          if-no-files-found: error
      - name: Upload the Play bundle
        if: (startsWith(github.ref, 'refs/tags/') || (inputs.daily_test && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cassini-android-play
          compression-level: 0
          path: play/
          if-no-files-found: error
      - name: Upload the APK under test and its device test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cassini-android-device-tests
          path: |
            app/build/outputs/apk/${{ (startsWith(github.ref, 'refs/tags/') || (inputs.daily_test && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && 'releaseTest' || 'debug' }}/*.apk
            app/build/outputs/apk/androidTest/*/*.apk
          if-no-files-found: error
      - name: Stage only the emulator's x86_64 APK inputs
        env:
          DEVICE_TEST_TYPE: ${{ (startsWith(github.ref, 'refs/tags/') || (inputs.daily_test && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'))) && 'releaseTest' || 'debug' }}
        run: python3 scripts/stage-emulator-inputs.py
      - name: Upload compact emulator inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cassini-emulator-inputs
          compression-level: 0
          path: build/emulator-inputs/
          if-no-files-found: error
      # A separate artifact: in the one above, a path outside app/build/outputs/apk would change its layout.
      - name: Upload the :data device test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cassini-data-device-tests
          path: data/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-checks
          path: |
            build/reports/profile/
            build/reports/resources/
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-*.html
            app-logic/build/reports/tests/
            app-logic/build/test-results/test/
            core/build/reports/tests/
            core/build/test-results/test/
            engine/build/reports/tests/testDebugUnitTest/
            engine/build/test-results/testDebugUnitTest/
            data/build/reports/tests/testDebugUnitTest/
            data/build/test-results/testDebugUnitTest/
            data/build/reports/lint-results-*.html
            data/schemas/
            ui/build/reports/tests/testDebugUnitTest/
            ui/build/test-results/testDebugUnitTest/
            ui/build/reports/lint-results-*.html
          if-no-files-found: warn

  emulator:
    name: Device checks (API ${{ matrix.api }})
    # The cheap checks end minutes before build, so waiting for them costs no wall time, and a head that is already
    # red on detekt, lint scripts, the verbatim diff or :core starts no emulators (D66 AND-11).
    needs: [build, checks, core-only]
    runs-on: ubuntu-24.04
    # About 2.7x the longest job seen, a retried attempt included (7.5 min): a hung emulator stops early (D66 AND-8).
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # PR edges by default; full-ci label additions also trigger a complete run.
        api: ${{ fromJSON((github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'full-ci')) && '[26,29,34,35]' || '[26,35]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      # Keep the published/full device artifacts above for users and tag tooling. Matrix jobs need only x86_64.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cassini-emulator-inputs
          path: .tools
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # scripts/ci-emulator-smoke.sh: the @CiSmoke tests, the per-API rules, NoteFtsDeviceTest on API 26 and the
      # launch check of the published APK.
      - name: Run the device checks
        id: first-attempt
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          TEST_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: cassini-ci
          pre-emulator-launch-script: python3 -I scripts/ci-emulator-heap.py configure "$TEST_API" "$ANDROID_AVD_HOME/cassini-ci.avd/config.ini"
          disable-animations: true
          script: ./scripts/ci-emulator-smoke.sh
      # One retry on a new emulator, for a boot or adb failure of the runner. When device-smoke.sh printed the
      # dry-run count, the emulator worked and the tests ran: then a failure is a test failure, and the job fails
      # with no retry. The first results stay for review.
      - name: Keep the results of the first attempt
        if: steps.first-attempt.outcome == 'failure'
        run: |
          if grep -qs '^Selected tests (dry run):' .tools/emulator-results/instrumentation.txt; then
            echo "::error title=Device checks (API ${{ matrix.api }})::The tests ran and failed; the job does not retry them."
            exit 1
          fi
          echo "::warning title=Emulator retry (API ${{ matrix.api }})::The emulator or adb failed before the tests; the job runs the checks one more time."
          if [ -d .tools/emulator-results ]; then mv .tools/emulator-results .tools/emulator-results-attempt-1; fi
      - name: Run the device checks again
        if: steps.first-attempt.outcome == 'failure'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          TEST_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          avd-name: cassini-ci
          pre-emulator-launch-script: python3 -I scripts/ci-emulator-heap.py configure "$TEST_API" "$ANDROID_AVD_HOME/cassini-ci.avd/config.ini"
          disable-animations: true
          script: ./scripts/ci-emulator-smoke.sh
      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-api-${{ matrix.api }}
          path: |
            .tools/emulator-results/
            .tools/emulator-results-attempt-1/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, core-only, build, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cassini-android
          path: dist
      # The notes are the CHANGELOG.md section of the tag. Relative links point at the files of the tag.
      - name: Write the release notes
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 -I scripts/changelog-section.py "$TAG" \
            --link-base "https://github.com/$GH_REPO/blob/$TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --title "${TAG#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"

  # Uploads the bundle of a tag to the internal testing track of Google Play, after the GitHub release. Without the
  # PLAY_SERVICE_ACCOUNT_JSON secret the job only reports a notice; the first bundle of a new Play app must be uploaded
  # by hand in Play Console anyway (docs/release.md, "Google Play").
  play:
    if: >-
      always() && !cancelled() &&
      ((startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success') ||
       ((inputs.daily_test && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && needs.checks.result == 'success' &&
        needs.core-only.result == 'success' && needs.build.result == 'success' && needs.emulator.result == 'success'))
    needs: [release, checks, core-only, build, emulator]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check for the Play credentials
        id: credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          DAILY_TEST: ${{ inputs.daily_test }}
          RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: |
          if [ "$DAILY_TEST" = true ] && { [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ] || [ "$RELEASE_STATUS" != completed ]; }; then
            echo "::error::Daily internal releases require Play credentials and PLAY_RELEASE_STATUS=completed."
            exit 1
          fi
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Google Play::PLAY_SERVICE_ACCOUNT_JSON is not set; the bundle is in the cassini-android-play artifact."
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.credentials.outputs.present == 'true'
        with:
          name: cassini-android-play
          path: play
      - name: Upload to the internal testing track
        if: steps.credentials.outputs.present == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.codemyriad.cassini.talk
          releaseFiles: play/*.aab
          releaseName: ${{ inputs.daily_test && fromJSON(inputs.daily_plan).version_name || github.ref_name }}
          track: internal
          # A Play app that has never been rolled out accepts only drafts; set the variable to draft until then.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: play/whatsnew
          mappingFile: play/mapping.txt
