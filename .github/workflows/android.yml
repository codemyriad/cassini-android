name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Weekly: rebuild the sherpa-onnx AAR from the pinned source and compare it with the release build.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      native-from-source:
        description: Also rebuild the sherpa-onnx AAR from source (about 40 minutes)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Wrapper, detekt, actionlint, shellcheck and ruff
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: detekt
        run: ./gradlew --no-daemon detekt
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --quiet
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tools/*.sh
      - name: ruff
        run: pipx run --spec ruff==0.14.0 ruff check --config config/ruff.toml scripts

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Restore beta signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          BETA_KEYSTORE: ${{ secrets.ANDROID_BETA_KEYSTORE }}
        run: |
          test -n "$BETA_KEYSTORE"
          mkdir -p "$HOME/.android"
          printf '%s' "$BETA_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          echo "CASSINI_BETA_KEYSTORE_FILE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - name: Pass release signing secrets
        if: startsWith(github.ref, 'refs/tags/')
        # The 'android' fallbacks are temporary: they keep tag builds working until the owner rotates
        # the keystore passwords and stores them as secrets.
        env:
          STORE_PASSWORD: ${{ secrets.CASSINI_RELEASE_STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.CASSINI_RELEASE_KEY_PASSWORD || 'android' }}
          KEY_ALIAS: ${{ secrets.CASSINI_RELEASE_KEY_ALIAS || 'androiddebugkey' }}
        run: |
          {
            echo "CASSINI_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CASSINI_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "CASSINI_RELEASE_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
      # setup.sh fetches the pinned release AAR and fails fast when it cannot; only the weekly
      # `native` job builds the AAR from source. The NDK above compiles libcassini_opus.so.
      - name: Cache the native runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/m2/org
            .tools/opus/source.tar.gz
          key: native-${{ hashFiles('scripts/native-dependencies.json', 'scripts/streaming-diarization.patch', 'gradle/libs.versions.toml') }}
      - name: Fetch the pinned native runtime
        run: ./scripts/setup.sh --prebuilt-only
      - name: Cache Robolectric's Android runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', '**/src/test/resources/robolectric.properties') }}
      # On tags the device tests run against releaseTest (the release build without R8), because R8
      # removes members the tests call; the emulator job then launch-checks the published release APK.
      - name: Build APK, run unit and conformance tests, and lint
        env:
          BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'Release' || 'Debug' }}
          DEVICE_TEST_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'releaseTest' || 'debug' }}
        run: |
          ./gradlew --no-daemon \
            -PdeviceTestBuildType="$DEVICE_TEST_TYPE" \
            ":app:assemble$BUILD_TYPE" ":app:assemble${DEVICE_TEST_TYPE^}" ":app:assemble${DEVICE_TEST_TYPE^}AndroidTest" \
            :app:testDebugUnitTest ":app:lint$BUILD_TYPE"
      - name: Prepare installable APK
        env:
          TAG: ${{ github.ref_name }}
          APK_VARIANT: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'debug' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          python3 scripts/package-apk.py
      - name: Collect corresponding native sources
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/package-native-sources.py
      - name: Upload APK and sources
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cassini-android
          compression-level: 0
          path: dist/*
          if-no-files-found: error
      - name: Upload the APK under test and its device test APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cassini-android-device-tests
          path: |
            app/build/outputs/apk/${{ startsWith(github.ref, 'refs/tags/') && 'releaseTest' || 'debug' }}/*.apk
            app/build/outputs/apk/androidTest/*/*.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-checks
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-*.html
          if-no-files-found: warn

  emulator:
    name: Playback, recording and settings (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 34]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cassini-android
          path: .tools/ci-apk
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cassini-android-device-tests
          path: .tools/ci-tests
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check CI's APK on Android
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          TEST_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: ./scripts/ci-emulator-smoke.sh
      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-api-${{ matrix.api }}
          path: .tools/emulator-results/
          if-no-files-found: warn

  native:
    name: sherpa-onnx AAR from source
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.native-from-source)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Cache the pinned source archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tools/native-build/sherpa-onnx.tar.gz
            .tools/opus/source.tar.gz
          key: native-source-${{ hashFiles('scripts/native-dependencies.json') }}
      # setup.sh finds the pinned NDK inside ANDROID_HOME. The job reports drift and does not fail
      # on it: a source build is not yet known to match the release byte for byte. The summary
      # records both hashes and a mismatch raises a warning annotation.
      - name: Build the AAR from source
        run: ./scripts/setup.sh --from-source
      - name: Record the AAR hashes
        run: |
          . scripts/native-common.sh
          built=$(sha256_of "$aar_installed")
          pinned=$(pin sherpa-onnx-aar sha256)
          {
            echo "Source-built AAR: \`$built\`"
            echo
            echo "Pinned release AAR: \`$pinned\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$built" != "$pinned" ]; then
            echo "::warning title=Native AAR drift::The AAR built from source ($built) differs from the pinned release build ($pinned)."
          fi
      - name: Build and test the app with the source-built AAR
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, build, emulator]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cassini-android
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --title "${TAG#v}" \
            --notes-file docs/release-notes.md "${prerelease[@]}"
