name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The weekly model and native runtime checks are in models.yml and native.yml (docs/development.md).
concurrency:
  # Manual runs use main's ref too; their own group keeps a push from cancelling them.
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  checks:
    name: Wrapper, detekt, actionlint, shellcheck, ruff, links, fonts and the verbatim diff
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # check-verbatim.sh compares with the 0.1.0 code at the phase-0 base commit.
          fetch-depth: 0
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: detekt
        run: ./gradlew --no-daemon detekt
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --silent --show-error -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --quiet
          tar xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck
        run: shellcheck -x scripts/*.sh tools/*.sh
      - name: ruff
        run: pipx run --spec ruff==0.14.0 ruff check --config config/ruff.toml scripts tools
      - name: Relative links in the Markdown files
        run: scripts/check-links.sh
      - name: Bundled fonts match their pins
        run: scripts/fetch-fonts.sh --check
      - name: No resource name is in both :app and :ui
        run: python3 -I scripts/check-resource-collisions.py
      # The release job publishes this section as the release notes. A tag without one fails here, so the release
      # job does not run. The build and emulator jobs do not wait for this job.
      - name: CHANGELOG.md has a section for the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 -I scripts/changelog-section.py "$GITHUB_REF_NAME" > /dev/null
      - name: Kept engine code has only its reviewed differences from 0.1.0
        run: scripts/check-verbatim.sh

  # The :core module needs only a JDK: no Android SDK, NDK, sherpa-onnx AAR or Opus source.
  core-only:
    name: Engine tests with a JDK alone
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # No setup.sh. The runner image ships an Android SDK; hiding it proves :core does not need one.
      # --configure-on-demand keeps Gradle from configuring the Android modules (docs/development.md).
      - name: Run the :core tests
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew --no-daemon --configure-on-demand :core:test
      - name: Upload the :core test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-tests
          path: core/build/reports/tests/
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      # The release key signs the GitHub APK and the Play bundle (docs/release.md, "Signing"). No fallbacks: a tag
      # build without the four secrets fails here.
      - name: Restore the release signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_KEYSTORE: ${{ secrets.CASSINI_RELEASE_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.CASSINI_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.CASSINI_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CASSINI_RELEASE_KEY_ALIAS }}
        run: |
          for secret in RELEASE_KEYSTORE STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            if [ -z "${!secret}" ]; then echo "::error::The secret for $secret is not set"; exit 1; fi
          done
          keystore="$RUNNER_TEMP/release.keystore"
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          {
            echo "CASSINI_RELEASE_KEYSTORE_FILE=$keystore"
            echo "CASSINI_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
            echo "CASSINI_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            echo "CASSINI_RELEASE_KEY_ALIAS=$KEY_ALIAS"
          } >> "$GITHUB_ENV"
      # setup.sh fetches the pinned release AAR and fails fast when it cannot. Only native.yml builds the AAR from
      # source (weekly, by hand, and on changes to the native inputs). The NDK above compiles libcassini_opus.so.
      - name: Cache the native runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/m2/org
            .tools/opus/source.tar.gz
          key: native-${{ hashFiles('scripts/native-dependencies.json', 'scripts/streaming-diarization.patch', 'gradle/libs.versions.toml') }}
      - name: Fetch the pinned native runtime
        run: ./scripts/setup.sh --prebuilt-only
      - name: Cache Robolectric's Android runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml', '**/src/test/resources/robolectric.properties') }}
      # On tags the device tests run against releaseTest (the release build without R8), because R8
      # removes members the tests call; the emulator job then launch-checks the published release APK.
      - name: Build APK, run unit and conformance tests, and lint
        env:
          BUILD_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'Release' || 'Debug' }}
          DEVICE_TEST_TYPE: ${{ startsWith(github.ref, 'refs/tags/') && 'releaseTest' || 'debug' }}
          # On tags, also the bundle for Google Play.
          BUNDLE_TASK: ${{ startsWith(github.ref, 'refs/tags/') && ':app:bundleRelease' || '' }}
        # Two Gradle runs: with -PdeviceTestBuildType=releaseTest, AGP 9 makes unit-test tasks only for that build
        # type, so ciTest (testDebugUnitTest) cannot run in the same invocation on a tag.
        run: |
          # shellcheck disable=SC2086 # BUNDLE_TASK is empty or one task name.
          ./gradlew --no-daemon \
            ":app:assemble$BUILD_TYPE" $BUNDLE_TASK :data:assembleDebugAndroidTest \
            ciTest ":app:lint$BUILD_TYPE" ":data:lint$BUILD_TYPE" ":ui:lint$BUILD_TYPE"
          ./gradlew --no-daemon \
            -PdeviceTestBuildType="$DEVICE_TEST_TYPE" \
            ":app:assemble${DEVICE_TEST_TYPE^}" ":app:assemble${DEVICE_TEST_TYPE^}AndroidTest"
      # ciTest runs verifyRoborazziDebug in :ui. It writes the actual image and a diff of each changed golden to
      # <module>/build/outputs/roborazzi.
      - name: Upload the screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roborazzi-diffs
          path: '**/build/outputs/roborazzi'
          if-no-files-found: ignore
      - name: Prepare installable APK
        env:
          TAG: ${{ github.ref_name }}
          APK_VARIANT: ${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'debug' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          python3 scripts/package-apk.py
      - name: Collect corresponding native sources
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/package-native-sources.py
      - name: Upload APK and sources
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cassini-android
          compression-level: 0
          path: dist/*
          if-no-files-found: error
      - name: Upload the Play bundle
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cassini-android-play
          compression-level: 0
          path: play/
          if-no-files-found: error
      - name: Upload the APK under test and its device test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cassini-android-device-tests
          path: |
            app/build/outputs/apk/${{ startsWith(github.ref, 'refs/tags/') && 'releaseTest' || 'debug' }}/*.apk
            app/build/outputs/apk/androidTest/*/*.apk
          if-no-files-found: error
      # A separate artifact: in the one above, a path outside app/build/outputs/apk would change its layout.
      - name: Upload the :data device test APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cassini-data-device-tests
          path: data/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-checks
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-*.html
            core/build/reports/tests/
            core/build/test-results/test/
            engine/build/reports/tests/testDebugUnitTest/
            engine/build/test-results/testDebugUnitTest/
            data/build/reports/tests/testDebugUnitTest/
            data/build/test-results/testDebugUnitTest/
            data/build/reports/lint-results-*.html
            ui/build/reports/tests/testDebugUnitTest/
            ui/build/test-results/testDebugUnitTest/
            ui/build/reports/lint-results-*.html
          if-no-files-found: warn

  emulator:
    name: Device checks (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 29, 34, 35]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cassini-android
          path: .tools/ci-apk
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cassini-android-device-tests
          path: .tools/ci-tests
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cassini-data-device-tests
          path: .tools/ci-data-tests
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # scripts/ci-emulator-smoke.sh: the @CiSmoke tests, the per-API rules, NoteFtsDeviceTest on API 26 and the
      # launch check of the published APK.
      - name: Run the device checks
        id: first-attempt
        continue-on-error: true
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          TEST_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: ./scripts/ci-emulator-smoke.sh
      # One retry on a new emulator, for a boot or adb failure of the runner. When device-smoke.sh printed the
      # dry-run count, the emulator worked and the tests ran: then a failure is a test failure, and the job fails
      # with no retry. The first results stay for review.
      - name: Keep the results of the first attempt
        if: steps.first-attempt.outcome == 'failure'
        run: |
          if grep -qs '^Selected tests (dry run):' .tools/emulator-results/instrumentation.txt; then
            echo "::error title=Device checks (API ${{ matrix.api }})::The tests ran and failed; the job does not retry them."
            exit 1
          fi
          echo "::warning title=Emulator retry (API ${{ matrix.api }})::The emulator or adb failed before the tests; the job runs the checks one more time."
          if [ -d .tools/emulator-results ]; then mv .tools/emulator-results .tools/emulator-results-attempt-1; fi
      - name: Run the device checks again
        if: steps.first-attempt.outcome == 'failure'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          TEST_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          script: ./scripts/ci-emulator-smoke.sh
      - name: Upload emulator results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-api-${{ matrix.api }}
          path: |
            .tools/emulator-results/
            .tools/emulator-results-attempt-1/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [checks, core-only, build, emulator]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cassini-android
          path: dist
      # The notes are the CHANGELOG.md section of the tag. Relative links point at the files of the tag.
      - name: Write the release notes
        env:
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 -I scripts/changelog-section.py "$TAG" \
            --link-base "https://github.com/$GH_REPO/blob/$TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --title "${TAG#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" "${prerelease[@]}"

  # Uploads the bundle of a tag to the internal testing track of Google Play, after the GitHub release. Without the
  # PLAY_SERVICE_ACCOUNT_JSON secret the job only reports a notice; the first bundle of a new Play app must be uploaded
  # by hand in Play Console anyway (docs/release.md, "Google Play").
  play:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check for the Play credentials
        id: credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Google Play::PLAY_SERVICE_ACCOUNT_JSON is not set; the bundle is in the cassini-android-play artifact."
          fi
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.credentials.outputs.present == 'true'
        with:
          name: cassini-android-play
          path: play
      - name: Upload to the internal testing track
        if: steps.credentials.outputs.present == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: org.cassini.android
          releaseFiles: play/*.aab
          releaseName: ${{ github.ref_name }}
          track: internal
          # A Play app that has never been rolled out accepts only drafts; set the variable to draft until then.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          whatsNewDirectory: play/whatsnew
          mappingFile: play/mapping.txt
