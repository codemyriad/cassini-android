# TEMPORARY (removed before merge): records the :ui screenshot goldens on Linux x86_64 for this branch and uploads
# them, because several goldens share one output name in roborazzi-diffs (CONTRIBUTING.md, "Screenshot goldens").
name: Record screenshot goldens
on:
  pull_request:
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@7296c772c13d12d9871528814b51fb2143c138ef # v6.4.1
        with:
          cache-provider: basic
      - name: Fetch the pinned native runtime
        run: ./scripts/setup.sh --prebuilt-only
      - name: Record the goldens
        run: ./gradlew --no-daemon :ui:recordRoborazziDebug
      - name: Upload the goldens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recorded-goldens
          path: ui/src/test/screenshots
