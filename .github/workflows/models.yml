name: Models

# The @NeedsModels device tests with the real models (Parakeet, the speech detector, Nemotron-3 diarization and
# CAM++). The models are about 770 MB, so this runs weekly and by hand only (docs/development.md).
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: models-${{ github.ref }}
  cancel-in-progress: true

jobs:
  models:
    name: Transcription with the real models (API 34)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358 cmake;3.22.1'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
      - name: Cache the native runtime
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            native/m2/org
            .tools/opus/source.tar.gz
          key: native-${{ hashFiles('scripts/native-dependencies.json', 'scripts/streaming-diarization.patch', 'gradle/libs.versions.toml') }}
      - name: Fetch the pinned native runtime
        run: ./scripts/setup.sh --prebuilt-only
      # The background tests transcribe the long clip, which is made on the host and packaged into the test APK.
      - name: Make the long clip of the background tests
        run: |
          if ! command -v ffmpeg > /dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends ffmpeg
          fi
          ./scripts/make-long-clip.sh
      # A debug build: scripts/push-models.sh copies the models into the app's files/ with run-as.
      - name: Build the debug APK and its device test APK
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      # The key comes from the SHA-256 values of scripts/ci-models.json, which ModelCatalogTest keeps equal to
      # ModelCatalog. A changed pin makes a new cache.
      - name: Make the model cache key
        id: model-key
        run: echo "key=$(python3 -I scripts/fetch-ci-models.py --print-key)" >> "$GITHUB_OUTPUT"
      # Restore and save are separate steps: the verified models go into the cache before the device tests, so a
      # test failure does not make the next run download them again.
      - name: Restore the models
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/ci-models
          key: ${{ steps.model-key.outputs.key }}
      - name: Fetch and verify the models
        run: python3 -I scripts/fetch-ci-models.py
      - name: Save the models
        if: steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/ci-models
          key: ${{ steps.model-key.outputs.key }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The models need room on /data (about 770 MB, plus a staged copy of the largest file) and RAM for Parakeet.
      - name: Run the @NeedsModels tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 4096M
          disk-size: 6144M
          disable-animations: true
          script: ./scripts/ci-models-smoke.sh
      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: models-api-34
          path: .tools/models-results/
          if-no-files-found: warn
