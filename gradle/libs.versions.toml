[versions]
# Build tooling. Verified together on 2026-10-09 with JDK 17 on this machine:
# Gradle 9.7.0 + AGP 9.3.1 (android.builtInKotlin=false, android.newDsl=false) + KGP 2.4.21
# sit inside the Kotlin Gradle plugin's documented range (AGP 8.5.2-9.3.1, Gradle 7.6.3-9.7.0).
agp = "9.3.1"
kotlin = "2.4.21"
ksp = "2.3.12"
room = "2.8.5"
detekt = "1.23.8"

# Android SDK. compileSdk 37 is required by the AndroidX versions below (AGP 8.13 cannot compile against 37).
# targetSdk 36 with the Compose UI (edge to edge and predictive back). Not 37: the Android 17 behaviour changes are
# not reviewed yet (docs/architecture.md section 8).
compileSdk = "37"
targetSdk = "36"
minSdk = "26"
buildTools = "36.0.0"
ndk = "28.2.13676358"
cmake = "3.22.1"

# AndroidX
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
navigation3 = "1.2.0"
coreKtx = "1.19.1"
appcompat = "1.8.0"
datastore = "1.2.1"
annotation = "1.11.0"

# Kotlin libraries
coroutines = "1.11.0"
serialization = "1.11.0"
collectionsImmutable = "0.5.2"

# Third party
zstd = "1.5.7-22"
orgJson = "20240303"
# Patched sherpa-onnx AAR served from the repo-local Maven directory native/m2 (scripts/setup.sh).
sherpaOnnx = "1.13.7-1f23907a"

# Tests
junit = "4.13.2"
robolectric = "4.17"
# Screenshot tests in :ui (Robolectric native graphics).
roborazzi = "1.76.0"
turbine = "1.2.1"
androidxTestRunner = "1.7.0"
androidxTestCore = "1.7.0"
androidxTestExt = "1.3.0"
uiautomator = "2.4.0"
espresso = "3.7.0"

[libraries]
# Compose (versions from the BOM; add platform(libs.compose.bom) to implementation, testImplementation and androidTestImplementation)
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
# enableAccessibilityChecks() (Accessibility Test Framework). Device tests only: under Robolectric the Compose
# rule logs "Accessibility checks are currently not supported by Robolectric" and ATF skips Compose content.
compose-ui-test-junit4-accessibility = { group = "androidx.compose.ui", name = "ui-test-junit4-accessibility" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Activity, lifecycle, navigation
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
lifecycle-service = { group = "androidx.lifecycle", name = "lifecycle-service", version.ref = "lifecycle" }
lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }

# Data
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-testing = { group = "androidx.room", name = "room-testing", version.ref = "room" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Core AndroidX
core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }

# Kotlin
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-collections-immutable = { group = "org.jetbrains.kotlinx", name = "kotlinx-collections-immutable", version.ref = "collectionsImmutable" }

# Native runtime and codecs
sherpa-onnx-nemotron = { group = "org.cassini.native", name = "sherpa-onnx-nemotron", version.ref = "sherpaOnnx" }
# Use "${libs.zstd.jni.get()}@aar" in Android modules and the plain jar in JVM tests.
zstd-jni = { group = "com.github.luben", name = "zstd-jni", version.ref = "zstd" }
org-json = { group = "org.json", name = "json", version.ref = "orgJson" }

# Tests
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
roborazzi = { group = "io.github.takahirom.roborazzi", name = "roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { group = "io.github.takahirom.roborazzi", name = "roborazzi-compose", version.ref = "roborazzi" }
roborazzi-junit-rule = { group = "io.github.takahirom.roborazzi", name = "roborazzi-junit-rule", version.ref = "roborazzi" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbine" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
androidx-test-core-ktx = { group = "androidx.test", name = "core-ktx", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExt" }
androidx-test-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

# Static analysis
detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }

[bundles]
# Bundles hold only artifacts with an explicit version. Declare the BOM-managed artifacts
# (compose-ui, compose-ui-graphics, compose-ui-tooling-preview, compose-foundation,
# compose-material3, compose-ui-test-junit4, ...) next to platform(libs.compose.bom) in each module.
compose = ["activity-compose", "lifecycle-runtime-compose", "lifecycle-viewmodel-compose"]
navigation3 = ["navigation3-runtime", "navigation3-ui", "lifecycle-viewmodel-navigation3"]
room = ["room-runtime", "room-ktx"]
testing-jvm = ["junit", "coroutines-test", "turbine"]
testing-robolectric = ["junit", "robolectric", "androidx-test-core", "androidx-test-core-ktx", "androidx-test-ext-junit", "coroutines-test", "turbine"]
testing-android = ["androidx-test-runner", "androidx-test-core", "androidx-test-ext-junit", "androidx-test-uiautomator", "coroutines-test"]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
# :bench, the device experiments that instrument :app (never in CI).
android-test = { id = "com.android.test", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
