<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Cassini — Name a speaker</title>

</head>
<body>
<x-dc>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8A9098; font-family: 'Instrument Sans', system-ui, sans-serif; color: #14171A; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden">

  <div role="dialog" aria-labelledby="sheet-title" style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 10px 20px 24px; display: flex; flex-direction: column; gap: 16px">
    <span style="width: 36px; height: 4px; border-radius: 2px; background: #C9CED5; align-self: center; display: block"></span>

    <div style="display: flex; align-items: center; gap: 12px">
      <span style="width: 40px; height: 40px; border-radius: 20px; background: #FCEFE3; color: #8A3B07; display: grid; place-items: center; font-weight: 700">3</span>
      <div style="flex: 1">
        <h2 id="sheet-title" style="margin: 0; font-size: 20px; font-weight: 600">Speaker 3</h2>
        <p style="margin: 0; font-size: 13px; color: #4A525B">Speaks for 3 min 12 s in this note</p>
      </div>
      <button aria-label="Play a sample of this voice" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #C9CED5; background: #FFFFFF; display: grid; place-items: center"><svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"></path></svg></button>
    </div>

    <div>
      <label for="spname" style="font-size: 13px; font-weight: 600; color: #3A4250">Name</label>
      <input id="spname" value="Anna" maxlength="80" style="margin-top: 6px; width: 100%; box-sizing: border-box; height: 52px; border: 2px solid #2346C8; border-radius: 14px; padding: 0 14px; font: inherit; font-size: 17px; outline: 0">
    </div>

    <div>
      <h3 style="margin: 0 0 6px; font-size: 13px; font-weight: 600; color: #3A4250">Saved voices, closest first</h3>
      <ul style="list-style: none; margin: 0; padding: 0; border: 1px solid #E2E5E9; border-radius: 14px; overflow: hidden">
        <li><button style="width: 100%; min-height: 52px; border: 0; background: #F5F6F7; display: flex; align-items: center; gap: 10px; padding: 0 14px; text-align: left; font-size: 16px">
          <span style="flex: 1">Anna Ricci</span>
          <span style="font-size: 12px; font-weight: 600; color: #1A3596; background: #E8EDFC; border-radius: 8px; padding: 2px 8px">Likely</span>
        </button></li>
        <li style="border-top: 1px solid #E2E5E9"><button style="width: 100%; min-height: 52px; border: 0; background: #FFFFFF; display: flex; align-items: center; padding: 0 14px; text-align: left; font-size: 16px">Annalisa B.</button></li>
        <li style="border-top: 1px solid #E2E5E9"><button style="width: 100%; min-height: 52px; border: 0; background: #FFFFFF; display: flex; align-items: center; padding: 0 14px; text-align: left; font-size: 16px">Marco</button></li>
      </ul>
    </div>

    <div style="background: #FCF6EE; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.45">
      <p style="margin: 0 0 8px"><strong>“Anna Ricci” is already a saved voice.</strong> Is this the same person?</p>
      <div style="display: flex; gap: 8px">
        <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #14171A; color: #FFFFFF; font-size: 14px; font-weight: 600">Same person</button>
        <button style="height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid #C9CED5; background: #FFFFFF; font-size: 14px">Someone else</button>
      </div>
    </div>

    <label style="display: flex; align-items: flex-start; gap: 12px; cursor: pointer">
      <input type="checkbox" checked="" style="width: 22px; height: 22px; margin: 2px 0 0; accent-color: #2346C8">
      <span style="flex: 1; font-size: 15px; line-height: 1.4"><strong style="font-weight: 600">Remember this voice on this phone</strong><br><span style="font-size: 13px; color: #4A525B">Future notes will name Anna automatically. The voiceprint never leaves the phone.</span></span>
    </label>

    <div style="display: flex; gap: 8px; align-items: center; justify-content: space-between; padding-top: 4px">
      <button style="height: 48px; padding: 0 14px; border: 0; background: transparent; font-size: 15px; font-weight: 600; color: #1A3596">Merge into…</button>
      <div style="display: flex; gap: 8px">
        <a href="Note.dc.html" style="height: 48px; padding: 0 18px; border-radius: 24px; border: 1px solid #C9CED5; display: flex; align-items: center; font-size: 15px; color: #14171A; text-decoration: none">Cancel</a>
        <a href="Note.dc.html" style="height: 48px; padding: 0 22px; border-radius: 24px; background: #2346C8; color: #FFFFFF; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none">Save name</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>


</body></html>
