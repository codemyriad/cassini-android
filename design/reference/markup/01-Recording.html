<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Cassini — Recording</title>

</head>
<body>
<x-dc>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #14171A; color: #F2F3F5; font-family: 'Instrument Sans', system-ui, sans-serif; display: flex; flex-direction: column; padding: 16px 16px 28px">

  <header style="display: flex; align-items: center; justify-content: space-between; height: 48px">
    <a href="Main.dc.html" aria-label="Minimise to library (recording continues)" style="width: 44px; height: 44px; border-radius: 22px; display: grid; place-items: center; color: #F2F3F5"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></a>
    <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #FF9A6B"><span style="width: 10px; height: 10px; border-radius: 5px; background: #FF6A2B; display: block"></span>Recording</span>
    <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A9B0B9; padding: 4px 8px; border: 1px solid #3A4048; border-radius: 8px">Opus 48 kHz</span>
  </header>

  <div style="margin-top: 28px">
    <label for="rectitle" style="font-size: 13px; color: #A9B0B9">Title</label>
    <div style="display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #3A4048; padding-bottom: 6px; margin-top: 4px">
      <input id="rectitle" value="Weekly product sync" style="flex: 1; border: 0; outline: 0; background: transparent; color: #F2F3F5; font: inherit; font-size: 22px; font-weight: 600; padding: 4px 0">
      <svg width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A9B0B9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 28px">
    <p role="timer" aria-live="off" style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-weight: 400; font-size: 72px; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">24:07</p>

    <div aria-label="Microphone level, last 7 seconds" role="img" style="width: 100%; height: 96px; display: flex; align-items: center; gap: 3px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="56">
        <span style="{{b.style}}"></span>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 14px; color: #A9B0B9; text-align: center; max-width: 300px; line-height: 1.45">Keeps recording with the screen off or in another app. Space for about 31 h more.</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: center; justify-items: center">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; color: #F2F3F5; text-decoration: none; font-size: 13px">
      <span style="width: 56px; height: 56px; border-radius: 28px; border: 1px solid #3A4048; display: grid; place-items: center"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h12"></path></svg></span>
      Library
    </a>
    <button aria-label="Pause recording" style="width: 88px; height: 88px; border-radius: 44px; border: 0; background: #F2F3F5; color: #14171A; display: grid; place-items: center">
      <svg width="30" height="30" sc-camel-view-box="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
    </button>
    <a href="Processing.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 6px; color: #F2F3F5; text-decoration: none; font-size: 13px">
      <span style="width: 56px; height: 56px; border-radius: 28px; background: #C2410C; display: grid; place-items: center"><span style="width: 18px; height: 18px; border-radius: 4px; background: #FFFFFF; display: block"></span></span>
      Finish
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() {
    const n = 56;
    const bars = [];
    for (let i = 0; i < n; i++) {
      const v = 0.18 + 0.82 * Math.abs(Math.sin(i * 0.61) * Math.cos(i * 0.23 + 1.1));
      const h = Math.max(4, Math.round(v * 92));
      const fresh = i > n - 8;
      bars.push({ style: 'flex: 1; height: ' + h + 'px; border-radius: 2px; background: ' + (fresh ? '#FF8A55' : '#4A525B') + '; display: block' });
    }
    return { bars };
  }
}
</script>


</body></html>
